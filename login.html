<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPOO Function 4 Review Program &mdash; Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('clerk_obs_dark')!=='0')document.documentElement.classList.add('dark');</script>
</head>
<body>
  <nav class="navbar">
    <h1 class="logo">RPOO Function 4 Review Program</h1>
  </nav>

  <main class="container login-container">
    <!-- Login Form -->
    <section class="card login-card" id="login-form">
      <h2>Sign In</h2>
      <p class="setup-subtitle">Enter your credentials to continue.</p>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="login-user">USPS Email</label>
          <div style="display:flex;align-items:center;gap:0">
            <input type="text" id="login-user" autocomplete="username" autofocus style="border-radius:6px 0 0 6px;border-right:none">
            <span style="padding:0.55rem 0.75rem;background:var(--card-bg,#e2e8f0);border:1px solid var(--border,#cbd5e1);border-left:none;border-radius:0 6px 6px 0;font-size:0.95rem;color:var(--text-muted,#64748b);white-space:nowrap">@usps.gov</span>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group fg-2" id="login-pass-row">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" autocomplete="current-password">
        </div>
      </div>
      <div class="form-row" id="login-newpw-row" hidden>
        <div class="form-group fg-2">
          <label for="login-newpw">Create Password</label>
          <input type="password" id="login-newpw" autocomplete="new-password">
        </div>
      </div>
      <div class="form-row" id="login-confirmpw-row" hidden>
        <div class="form-group fg-2">
          <label for="login-confirmpw">Confirm Password</label>
          <input type="password" id="login-confirmpw" autocomplete="new-password">
        </div>
      </div>
      <div class="setup-actions">
        <button id="login-btn" class="btn btn-primary btn-lg">Sign In</button>
      </div>
      <p id="login-error" class="status-msg error" hidden></p>
    </section>

    <!-- Force Password Change Form (hidden) -->
    <section class="card login-card" id="pw-change-form" hidden>
      <h2>Change Your Password</h2>
      <p class="setup-subtitle">Your account requires a password change before continuing.</p>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="new-pass">New Password</label>
          <input type="password" id="new-pass" autocomplete="new-password" autofocus>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="confirm-pass">Confirm Password</label>
          <input type="password" id="confirm-pass" autocomplete="new-password">
        </div>
      </div>
      <div class="setup-actions">
        <button id="pw-change-btn" class="btn btn-primary btn-lg">Set Password &amp; Continue</button>
      </div>
      <p id="pw-error" class="status-msg error" hidden></p>
    </section>

    <!-- First-Run Admin Setup (hidden) -->
    <section class="card login-card" id="first-run-form" hidden>
      <h2>First-Time Setup</h2>
      <p class="setup-subtitle">Create your admin account to get started.</p>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="setup-name">Your Name</label>
          <input type="text" id="setup-name" placeholder="e.g. Carney, Preston K" autofocus>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="setup-email">USPS Email</label>
          <div style="display:flex;align-items:center;gap:0">
            <input type="text" id="setup-email" style="border-radius:6px 0 0 6px;border-right:none">
            <span style="padding:0.55rem 0.75rem;background:var(--card-bg,#e2e8f0);border:1px solid var(--border,#cbd5e1);border-left:none;border-radius:0 6px 6px 0;font-size:0.95rem;color:var(--text-muted,#64748b);white-space:nowrap">@usps.gov</span>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="setup-pass">Password</label>
          <input type="password" id="setup-pass" autocomplete="new-password">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group fg-2">
          <label for="setup-pass2">Confirm Password</label>
          <input type="password" id="setup-pass2" autocomplete="new-password">
        </div>
      </div>
      <div class="setup-actions">
        <button id="setup-btn" class="btn btn-primary btn-lg">Create Admin Account</button>
      </div>
      <p id="setup-error" class="status-msg error" hidden></p>
    </section>
  </main>

  <script src="js/gh-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      Auth.bootstrap();

      // First-run: no users exist yet
      var allUsers = Auth.getUsers();
      if (allUsers.length === 0) {
        document.getElementById('login-form').hidden = true;
        var frForm = document.getElementById('first-run-form');
        frForm.hidden = false;
        var nameIn = document.getElementById('setup-name');
        var passIn = document.getElementById('setup-pass');
        var pass2In = document.getElementById('setup-pass2');
        var setupBtn = document.getElementById('setup-btn');
        var setupErr = document.getElementById('setup-error');

        function doSetup() {
          setupErr.hidden = true;
          var n = nameIn.value.trim();
          var em = document.getElementById('setup-email').value.trim().toLowerCase();
          if (em && em.indexOf('@') === -1) em = em + '@usps.gov';
          var p = passIn.value;
          var p2 = pass2In.value;
          if (!n) { setupErr.textContent = 'Please enter your name.'; setupErr.hidden = false; return; }
          if (!em) { setupErr.textContent = 'Please enter your email.'; setupErr.hidden = false; return; }
          if (!p || p.length < 4) { setupErr.textContent = 'Password must be at least 4 characters.'; setupErr.hidden = false; return; }
          if (p !== p2) { setupErr.textContent = 'Passwords do not match.'; setupErr.hidden = false; return; }
          setupBtn.disabled = true;
          Auth.hashPassword(p).then(function(hash) {
            var user = {
              id: crypto.randomUUID(),
              username: n,
              password: hash,
              displayName: n,
              email: em,
              role: 'admin',
              assignedFins: [],
              mustChangePassword: false,
              createdAt: new Date().toISOString()
            };
            var users = [user];
            localStorage.setItem('clerk_obs_users', JSON.stringify(users));
            return Auth.login(em, p);
          }).then(function() {
            window.location.href = 'index.html';
          });
        }

        setupBtn.addEventListener('click', doSetup);
        pass2In.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSetup(); });
        nameIn.focus();
        return;
      }

      var session = Auth.currentUser();
      if (session && !session.mustChangePassword) {
        window.location.href = 'index.html';
        return;
      }
      // If must change password, show that form immediately
      if (session && session.mustChangePassword) {
        showPwChange(session);
        return;
      }

      var userIn   = document.getElementById('login-user');
      var passIn   = document.getElementById('login-pass');
      var passRow  = document.getElementById('login-pass-row');
      var newPwRow = document.getElementById('login-newpw-row');
      var confPwRow = document.getElementById('login-confirmpw-row');
      var newPwIn  = document.getElementById('login-newpw');
      var confPwIn = document.getElementById('login-confirmpw');
      var btn      = document.getElementById('login-btn');
      var errEl    = document.getElementById('login-error');
      var isNewUser = false;

      // Detect new user when email field loses focus or Enter is pressed
      function checkNewUser() {
        var u = userIn.value.trim().toLowerCase();
        if (u && u.indexOf('@') === -1) u = u + '@usps.gov';
        if (!u) return;
        var info = Auth.lookupEmail(u);
        if (info && info.mustChangePassword) {
          isNewUser = true;
          passRow.hidden = true;
          newPwRow.hidden = false;
          confPwRow.hidden = false;
          btn.textContent = 'Create Account';
          newPwIn.focus();
        } else {
          isNewUser = false;
          passRow.hidden = false;
          newPwRow.hidden = true;
          confPwRow.hidden = true;
          btn.textContent = 'Sign In';
        }
      }
      userIn.addEventListener('blur', checkNewUser);

      function doLogin() {
        errEl.hidden = true;
        var u = userIn.value.trim().toLowerCase();
        if (u && u.indexOf('@') === -1) u = u + '@usps.gov';

        if (isNewUser) {
          // New user flow: create password
          var np = newPwIn.value;
          var cp = confPwIn.value;
          if (!u) { errEl.textContent = 'Please enter your USPS email.'; errEl.hidden = false; return; }
          if (!np || np.length < 4) { errEl.textContent = 'Password must be at least 4 characters.'; errEl.hidden = false; return; }
          if (np !== cp) { errEl.textContent = 'Passwords do not match.'; errEl.hidden = false; return; }
          btn.disabled = true;
          Auth.activateUser(u, np).then(function(result) {
            btn.disabled = false;
            if (result) {
              window.location.href = 'index.html';
            } else {
              errEl.textContent = 'Account not found or already activated. Try signing in.';
              errEl.hidden = false;
              isNewUser = false;
              passRow.hidden = false;
              newPwRow.hidden = true;
              confPwRow.hidden = true;
              btn.textContent = 'Sign In';
            }
          });
          return;
        }

        // Normal login flow
        var p = passIn.value;
        if (!u || !p) {
          errEl.textContent = 'Please enter both email and password.';
          errEl.hidden = false;
          return;
        }
        btn.disabled = true;
        Auth.login(u, p).then(function(result) {
          btn.disabled = false;
          if (result) {
            if (result.mustChangePassword) {
              showPwChange(result);
            } else {
              window.location.href = 'index.html';
            }
          } else {
            errEl.textContent = 'Invalid email or password.';
            errEl.hidden = false;
            passIn.value = '';
            passIn.focus();
          }
        });
      }

      btn.addEventListener('click', doLogin);
      passIn.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
      confPwIn.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
      userIn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { checkNewUser(); if (!isNewUser) passIn.focus(); }
      });

      function showPwChange(loggedInUser) {
        document.getElementById('login-form').hidden = true;
        var pwForm    = document.getElementById('pw-change-form');
        var newPassIn = document.getElementById('new-pass');
        var confIn    = document.getElementById('confirm-pass');
        var pwBtn     = document.getElementById('pw-change-btn');
        var pwErr     = document.getElementById('pw-error');
        pwForm.hidden = false;
        newPassIn.focus();

        function doChange() {
          pwErr.hidden = true;
          var np = newPassIn.value;
          var cp = confIn.value;
          if (!np || np.length < 3) {
            pwErr.textContent = 'Password must be at least 3 characters.';
            pwErr.hidden = false; return;
          }
          if (np !== cp) {
            pwErr.textContent = 'Passwords do not match.';
            pwErr.hidden = false; return;
          }
          pwBtn.disabled = true;
          Auth.hashPassword(np).then(function(hash) {
            Auth.updateUser(loggedInUser.id, { password: hash, mustChangePassword: false });
            window.location.href = 'index.html';
          });
        }

        pwBtn.addEventListener('click', doChange);
        confIn.addEventListener('keydown', function(e) { if (e.key === 'Enter') doChange(); });
      }
    })();
  </script>
</body>
</html>
